; gammastep 配置
; 昼夜切换用固定时刻（dawn-time/dusk-time），不用太阳高度角计算。
; dawn-time/dusk-time 只写单个时刻（不给区间）= 零宽过渡 = 到点瞬间切换。
; 系统时区未改（仍是 America/Los_Angeles），gammastep 靠 i3 里
; `env TZ=Asia/Shanghai gammastep` 单独指定时区，这两个时刻按上海时间算。

[general]
dawn-time=08:00
dusk-time=18:00

temp-day=6500
temp-night=3800

adjustment-method=randr
location-provider=manual

[manual]
; 上海坐标；dawn-time/dusk-time 已生效时不参与计算，仅作兜底
lat=31.23
lon=121.47
