# 配色跟 Noctalia 主题模板走，随浅深色模式自动重写。
include themes/noctalia.conf

# 对齐 alacritty.toml 里手调的那些设置

font_family      FiraCode Nerd Font Mono
font_size        15.0

hide_window_decorations yes
window_padding_width 12
background_opacity 1.0

scrollback_lines 3023

cursor_shape block
cursor_blink_interval 0.5
cursor_shape_unfocused hollow

# Neovide 那种平滑光标拖尾。cursor_trail 是触发前光标要停留的毫秒数（越小
# 越跟手，避免用它跟普通打字的小幅移动抢；小于 cursor_trail_start_threshold
# 格数的移动直接不触发，大跳才有拖尾）；decay 是拖尾消失快慢（秒），维持
# kitty 官方默认值，已经足够轻、不夸张。
cursor_trail 20
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

mouse_hide_wait 3
copy_on_select clipboard
mouse_map right press ungrabbed paste_from_selection

enable_audio_bell no
visual_bell_duration 0.0

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+n new_os_window
map ctrl+shift+equal increase_font_size
map ctrl+minus decrease_font_size
map ctrl+0 reset_font_size
map shift+enter send_text all \n
